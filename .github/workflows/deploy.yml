name: Deploy to GitHub Pages

# Triggers: every push to master/main, or manually from the Actions tab
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Allow the job to push to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build a fully-static export.
      # NEXT_EXPORT=1  → activates output:"export" + basePath in next.config.ts
      # NEXT_PUBLIC_BASE_PATH → baked into client bundles for SW registration & manifest
      # Firebase keys → add these as repository Secrets in GitHub Settings → Secrets
      - name: Build static export
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: "/roznaamcha"
          NEXT_PUBLIC_APP_URL: "https://basharatleogill.github.io/roznaamcha"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build

      # Prevent GitHub Pages from treating _next/ as a Jekyll resource
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Push only the out/ directory to gh-pages branch (no source code)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # Keep the gh-pages branch clean — only the latest build
          force_orphan: true
